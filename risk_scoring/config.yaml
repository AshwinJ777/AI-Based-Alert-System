# TTC (Time-to-Collision) thresholds
ttc_threshold: 2.0             # seconds — pairs below this are flagged as at-risk
high_severity_threshold: 1.0   # TTC < 1.0s → "high" severity
medium_severity_threshold: 2.0 # 1.0s ≤ TTC < 2.0s → "medium" severity

# Proximity filter — only compute TTC for vehicle pairs within this radius (pixels or meters)
# Vehicles further apart are skipped early to avoid O(n²) blowup
proximity_radius: 300.0

# Minimum closing speed to consider (filters out near-stationary convergence noise)
min_closing_speed: 1.0         # pixels/s (or meters/s if calibrated)

# Trajectory intersection validation
collision_distance_threshold: 50.0     # pixels — max CPA distance to consider a collision
trajectory_intersection_tolerance: 60.0 # pixels — tolerance for path proximity at any horizon
time_difference_tolerance: 1.5          # seconds — max arrival-time difference at CPA
